<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Irregular Verb Guess Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .fail {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Guess the Verb</h2>
        <p id="v1"></p>
        <input type="text" id="v2" placeholder="Enter past simple (V2)">
        <input type="text" id="v3" placeholder="Enter past participle (V3)">
        <button id="submitBtn" type="submit" onkeypress="handleSubmit()">Submit</button>
        <button id="newWordBtn">New Word</button>
        <div class="result" id="result"></div>
    </div>

        let currentVerb;

        function pickRandomVerb() {
            currentVerb = verbs[Math.floor(Math.random() * verbs.length)];
            document.getElementById('v1').textContent = `V1: ${currentVerb.v1}`;
            document.getElementById('v2').value = '';
            document.getElementById('v3').value = '';
            document.getElementById('result').textContent = '';
        }

        document.getElementById('submitBtn').addEventListener('click', () => {
            checkAnswer();
        });

        document.getElementById('newWordBtn').addEventListener('click', () => {
            pickRandomVerb();
        });

        document.querySelectorAll('#v2, #v3').forEach(input => {
            console.log(input);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); // prevent form submission
                    checkAnswer();
                }
            });
        });

        function checkAnswer() {
            const userV2 = document.getElementById('v2').value.trim().toLowerCase();
            const userV3 = document.getElementById('v3').value.trim().toLowerCase();

            if (userV2 === currentVerb.v2 && userV3 === currentVerb.v3) {
                document.getElementById('result').textContent = '✅ Correct!';
                document.getElementById('result').className = 'result success';
            } else {
                document.getElementById('result').textContent =
                    `❌ Wrong! Correct: ${currentVerb.v2}, ${currentVerb.v3}`;
                document.getElementById('result').className = 'result fail';
            }
        }

        pickRandomVerb();
    </script>
